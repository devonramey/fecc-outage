<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers Out</title>

  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.29/"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #555555;
      font-family: "Segoe UI", Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .outage-card {
      background: #333333;
      border-radius: 10px;
      padding: 1rem 1rem 0.9rem;
      max-width: 600px;
      width: calc(100% - 2rem);
      text-align: center;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.35);
    }

    .heading {
      font-size: 1.25rem;
      font-weight: 800;
      color: #111111;
      background: #ffd400;
      border-radius: 6px;
      padding: 0.4rem 1rem;
      display: inline-block;
      margin-bottom: 0.8rem;
    }

    .customer-count {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      margin: 0.2rem 0 0.5rem;
      color: #ff3b3b;
    }

    .customer-count.normal {
      color: #49d17d;
    }

    .description {
      font-size: 1.05rem;
      color: #eeeeee;
      margin-bottom: 0.8rem;
    }

    .updated {
      color: #cfcfcf;
      font-size: 0.9rem;
      margin-top: 0.75rem;
    }

    .error {
      color: #ffb3b3;
      font-size: 0.95rem;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="outage-card">
    <div id="outage-content">Loading customer outage total...</div>
  </div>

  <script>
    require(["esri/request"], function (esriRequest) {
      const layerQueryUrl =
        "https://catalyst.fecc.coop:6443/arcgis/rest/services/FieldPro/Milsoft_Outages/MapServer/0/query";

      const refreshMs = 60000;

      function formatTime(date) {
        return date.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      }

      function loadCustomersOut() {
        const statistics = [
          {
            statisticType: "sum",
            onStatisticField: "CustomersOutNow",
            outStatisticFieldName: "total_customers_out"
          }
        ];

        esriRequest(layerQueryUrl, {
          query: {
            where: "1=1",
            outStatistics: JSON.stringify(statistics),
            returnGeometry: false,
            f: "json",
            _ts: Date.now()
          },
          responseType: "json"
        })
          .then((response) => {
            const attributes = response?.data?.features?.[0]?.attributes;
            const total = Number(attributes?.total_customers_out || 0);
            const now = new Date();

            const hasOutage = total > 0;
            const heading = hasOutage
              ? "CUSTOMERS CURRENTLY OUT"
              : "OUTAGE STATUS";

            const description = hasOutage
              ? "Customers currently affected by active outages."
              : "No customers are currently reported out.";

            document.getElementById("outage-content").innerHTML = `
              <div class="heading">${heading}</div>
              <div class="customer-count ${hasOutage ? "" : "normal"}">
                ${total.toLocaleString()}
              </div>
              <div class="description">${description}</div>
              <div class="updated">
                Last updated: ${formatTime(now)}
              </div>
            `;
          })
          .catch((err) => {
            console.error("Error loading customer outage total:", err);

            document.getElementById("outage-content").innerHTML = `
              <div class="heading">OUTAGE STATUS</div>
              <div class="error">
                Unable to load the customer outage total.
                <br><br>
                Check the browser console for the specific service error.
              </div>
            `;
          });
      }

      loadCustomersOut();
      setInterval(loadCustomersOut, refreshMs);
    });
  </script>
</body>
</html>
